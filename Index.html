<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ফর মাই স্পেশাল পারসন ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 20px;
      color: #fff;
    }
    h1 { font-size: 26px; text-shadow: 1px 1px 4px rgba(0,0,0,0.2); }
    p { font-size: 16px; margin-bottom: 20px; }
    
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }
    .gallery img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 3px solid #fff;
      transition: transform 0.3s;
    }
    .gallery img:hover { transform: scale(1.05); }

    .message-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 20px;
      max-width: 460px;
      margin: 25px auto 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <h1>ভালোবাসার কিছু মুহূর্ত ❤️</h1>
  <p>তুমি আমার জীবনের সবচেয়ে সুন্দর উপহার!</p>

  <!-- ফটো গ্যালারি -->
  <div class="gallery">
    <img src="photo1.jpg" alt="Photo 1">
    <img src="photo2.jpg" alt="Photo 2">
    <img src="photo3.jpg" alt="Photo 3">
    <img src="photo4.jpg" alt="Photo 4">
  </div>

  <!-- মিষ্টি চিঠি বা মেসেজ -->
  <div class="message-card">
    <h3>তোমার জন্য একটি ছোট বার্তা ✨</h3>
    <p>সবসময় এভাবে হাসিখুশি থেকো। তোমার মিষ্টি হাসি আমার দিনটাকে সুন্দর করে দেয়!</p>
  </div>

</body>
</html>
